<!DOCTYPE html>
<html lang="zh-CN">
<head><!-- v1781043537 -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授信管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #f5f7fa; min-height: 100vh;
  display: flex; justify-content: center; padding: 20px 10px;
}
.container { width: 100%; max-width: 520px; }
.header {
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #fff; border-radius: 20px 20px 0 0;
  padding: 32px 28px 36px; position: relative;
}
.header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.header p { font-size: 13px; opacity: 0.85; }
.card {
  background: #fff; border-radius: 0 0 20px 20px;
  padding: 28px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  margin-bottom: 20px;
}
.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 14px; font-weight: 600;
  color: #555; margin-bottom: 8px;
}
.field input, .field select {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid #e0e4ea; border-radius: 12px;
  font-size: 16px; outline: none; background: #fafbfd;
  transition: border-color 0.2s;
}
.field input:focus, .field select:focus { border-color: #ff9800; background: #fff; }
.hint { font-size: 12px; color: #aaa; margin-top: 6px; }
.btn-save {
  width: 100%; padding: 15px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #fff; font-size: 17px; font-weight: 600;
  cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 4px 14px rgba(255,152,0,0.3);
  transition: all 0.2s;
}
.btn-save:hover { transform: translateY(-1px); }
.btn-save:active { transform: scale(0.98); }
.btn-del {
  width: 100%; padding: 13px; border: 1.5px solid #ffcdd2;
  border-radius: 14px; background: #fff; color: #e57373;
  font-size: 15px; font-weight: 600; cursor: pointer;
  margin-top: 10px; transition: all 0.2s;
}
.btn-del:hover { background: #ffebee; }
.status-ok {
  text-align: center; font-size: 14px; color: #43b97f;
  margin-top: 14px; font-weight: 600; display: none;
}
.status-ok.show { display: block; }

/* 用户列表 */
.user-list { margin-bottom: 24px; max-height:300px; overflow-y:auto; }
.user-item {
  background: #fff9f0; border-radius: 14px; padding: 16px 18px;
  margin-bottom: 12px; border: 1px solid #ffe0b2;
  cursor: pointer; transition: all 0.15s; position:relative;
}
.user-item:hover { border-color: #ff9800; background: #fff3e0; }
.user-item.active { border-color: #ff9800; background: #fff3e0; box-shadow: 0 2px 8px rgba(255,152,0,0.15); }
.user-item-name { font-size: 16px; font-weight: 700; color: #333; }
.user-item-detail { font-size: 13px; color: #888; margin-top: 4px; }

.preview-link {
  display: block; text-align: center; margin-top: 16px;
  font-size: 13px; color: #ff9800; text-decoration: none;
}
.preview-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔧 授信管理</h1>
    <p>按用户设置审批状态，修改后实时生效</p>
  </div>

  <div class="card">
    <!-- 用户列表 -->
    <div class="user-list" id="userList">
      <div style="text-align:center;color:#ccc;padding:30px;font-size:14px;">暂无用户数据</div>
    </div>

    <!-- 编辑区域 -->
    <div class="field">
      <label>用户姓名</label>
      <input type="text" id="adminName" placeholder="请输入用户姓名">
      <div class="hint">选择上方已有用户，或输入新用户名</div>
    </div>

    

    <div class="field">
      <label>审批状态</label>
      <select id="adminStatus">
        <option value="approved">✅ 审批通过</option>
        <option value="rejected">❌ 审批拒绝</option>
      </select>
    </div>

    <div class="field">
      <label>大数据评级</label>
      <select id="adminRating">
        <option value="">-- 请选择 --</option>
        <option value="AAA级">AAA级</option>
        <option value="AA级">AA级</option>
        <option value="A级">A级</option>
        <option value="BBB级">BBB级</option>
        <option value="BB级">BB级</option>
        <option value="B级">B级</option>
        <option value="CCC级">CCC级</option>
        <option value="CC级">CC级</option>
        <option value="C级">C级</option>
        <option value="D级">D级</option>
      </select>
    </div>

    <div class="field">
      <label>贷款类型</label>
      <select id="adminLoanType">
        <option value="">-- 请选择 --</option>
        <option value="经营贷款">经营贷款</option>
        <option value="消费贷款">消费贷款</option>
        <option value="房贷">房贷</option>
        <option value="车贷">车贷</option>
        <option value="信用贷">信用贷</option>
        <option value="抵押贷">抵押贷</option>
      </select>
    </div>

    <div class="field">
      <label>可授信额度</label>
      <input type="number" id="adminAmount" placeholder="例如: 50000" min="0" step="100">
    </div>

    
    <div class="field">
      <label>GitHub Token（用于写入额度数据）</label>
      <input type="password" id="adminToken" placeholder="ghp_xxxxxxxxxxxx">
      <div class="hint">需要 repo 权限的 Personal Access Token</div>
    </div>
    <button class="btn-save" onclick="saveAdmin()">💾 保存设置</button>
    <button class="btn-del" onclick="deleteUser()">🗑 删除该用户</button>
    <div class="status-ok" id="statusSaved">✅ 已保存，用户端实时生效</div>

    <a class="preview-link" href="credit.html" target="_blank">👉 打开用户端页面预览</a>
  </div>
</div>


<script>
  // ====== 全局变量 ======
  var GITHUB_TOKEN = '';
  var REPO = 'S-o-n-G-hua/merchant-app';
  var BRANCH = 'main';
  var FILE_PATH = 'credit-data.json';
  var currentSha = '';
  var currentUser = '';

  // ====== ghApi 封装 (与 admin.html 完全一致) ======
  function ghApi(method, path, body) {
    var opts = {
      method: method,
      headers: {
        'Authorization': 'token ' + GITHUB_TOKEN,
        'Content-Type': 'application/json',
        'User-Agent': 'merchant-admin'
      }
    };
    if (body) opts.body = JSON.stringify(body);
    return fetch('https://api.github.com' + path, opts).then(function(r) { return r.json(); });
  }

  // ====== 本地存储 ======
  function getUsers() {
    try { return JSON.parse(localStorage.getItem('creditUsers') || '{}'); } catch(e) { return {}; }
  }
  function saveUsers(u) { localStorage.setItem('creditUsers', JSON.stringify(u)); }

  // ====== 从 GitHub 加载数据到本地列表 ======
  function loadFromGitHub() {
    if (!GITHUB_TOKEN) { showStatus('请先填写 Token', false); return; }
    showStatus('正在加载...', true);
    ghApi('GET', '/repos/' + REPO + '/contents/' + FILE_PATH + '?ref=' + BRANCH)
      .then(function(res) {
        if (res.message) { showStatus('加载失败: ' + res.message, false); return; }
        currentSha = res.sha;
        var binary = atob(res.content.replace(/\n/g, ''));
        var bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        var decoded = new TextDecoder('utf-8').decode(bytes);
        var data = JSON.parse(decoded);
        if (data.users) saveUsers(data.users);
        renderUserList();
        showStatus('已从 GitHub 加载 (' + Object.keys(data.users || {}).length + ' 用户)', true);
      })
      .catch(function(err) { showStatus('网络错误: ' + err.message, false); });
  }

  // ====== 保存到 GitHub (带 currentSha，解决 409) ======
  function saveToGitHub(name, status, token, rating, loanType, amount) {
    GITHUB_TOKEN = token;
    showStatus('保存中...', true);

    // Step 1: GET 最新 SHA
    ghApi('GET', '/repos/' + REPO + '/contents/' + FILE_PATH + '?ref=' + BRANCH)
      .then(function(res) {
        if (!res.sha) throw new Error('GET failed: ' + (res.message || 'unknown'));
        currentSha = res.sha;

        // 解码现有数据
        var content;
        try {
          var raw = atob(res.content.replace(/\n/g, ''));
          var bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
          content = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        } catch(e) { content = { users: {}, note: '' }; }
        if (!content.users) content.users = {};

        // 更新用户数据
        content.users[name] = {
          status: status || 'approved',
          amount: amount || '',
          rating: rating || '',
          loanType: loanType || '',
          updatedAt: new Date().toLocaleString('zh-CN')
        };

        // 编码
        var jsonStr = JSON.stringify(content, null, 2);
        var enc = new TextEncoder().encode(jsonStr);
        var binary = Array.from(enc).map(function(b){return String.fromCharCode(b)}).join('');
        var b64content = btoa(binary);

        // Step 2: PUT (带最新 SHA)
        return ghApi('PUT', '/repos/' + REPO + '/contents/' + FILE_PATH, {
          message: 'update: 授信 ' + name + ' -> ' + status,
          content: b64content,
          sha: currentSha,
          branch: BRANCH
        });
      })
      .then(function(res) {
        if (res.content) {
          currentSha = res.content.sha; // 更新 SHA！
          showStatus('✅ 已保存到 GitHub，用户端可刷新查看', true);
        } else {
          showStatus('❌ 保存失败: ' + (res.message || 'unknown'), false);
        }
      })
      .catch(function(err) { showStatus('❌ 错误: ' + err.message, false); });
  }

  // ====== UI 函数 ======
  function showStatus(msg, ok) {
    var el = document.getElementById('statusSaved');
    if (!el) return;
    el.textContent = msg;
    el.style.color = ok ? '#10b981' : '#ef4444';
    el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); }, 5000);
  }

  function selectUser(name) {
    currentUser = name;
    var users = getUsers();
    var u = users[name] || {};
    document.getElementById('adminName').value = name;
    document.getElementById('adminStatus').value = u.status || 'approved';
    document.getElementById('adminRating').value = u.rating || '';
    document.getElementById('adminLoanType').value = u.loanType || '';
    document.getElementById('adminAmount').value = u.amount || '';
    renderUserList();
  }

  function renderUserList() {
    var ul = document.getElementById('userList');
    if (!ul) return;
    var users = getUsers();
    var names = Object.keys(users).sort();
    ul.innerHTML = '';
    if (names.length === 0) { ul.innerHTML = '<li class="empty">暂无用户</li>'; return; }
    names.forEach(function(n) {
      var u = users[n];
      var li = document.createElement('li');
      li.className = (n === currentUser) ? 'active' : '';
      var statusIcon = (u.status === 'approved') ? '✅' : (u.status === 'rejected') ? '❌' : '⏳';
      li.innerHTML = '<strong>' + n + '</strong> <span class="status">' + statusIcon + ' ' + (u.status||'') + '</span>' +
                     (u.amount ? ' <span class="amt">¥' + u.amount + '</span>' : '') +
                     (u.rating ? ' <span class="rating">' + u.rating + '</span>' : '');
      li.onclick = function() { selectUser(n); };
      ul.appendChild(li);
    });
  }

  function deleteUser() {
    var name = document.getElementById('adminName').value.trim();
    if (!name) { alert('请输入用户名'); return; }
    if (!confirm('确定删除用户 ' + name + ' ？')) return;
    var users = getUsers();
    delete users[name];
    saveUsers(users);
    if (currentUser === name) currentUser = '';
    document.getElementById('adminName').value = '';
    renderUserList();
  }

  function saveAdmin() {
    var name = document.getElementById('adminName').value.trim();
    if (!name) { alert('请输入用户姓名'); return; }
    var status = document.getElementById('adminStatus').value;
    var token = document.getElementById('adminToken').value.trim();
    if (!token) { alert('请先填写 GitHub Token'); return; }

    var ratingVal = document.getElementById('adminRating').value;
    var loanTypeVal = document.getElementById('adminLoanType').value;
    var amountVal = document.getElementById('adminAmount') ? document.getElementById('adminAmount').value : '';

    // 更新本地列表
    var users = getUsers();
    users[name] = { amount: amountVal || '', status: status, rating: ratingVal, loanType: loanTypeVal, updatedAt: new Date().toLocaleString('zh-CN') };
    saveUsers(users);
    currentUser = name;
    renderUserList();

    // 写入 GitHub
    saveToGitHub(name, status, token, ratingVal, loanTypeVal, amountVal);
  }

  // 初始化
  renderUserList();
</script>

</body>
</html>
