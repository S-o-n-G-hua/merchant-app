<!DOCTYPE html>
<html lang="zh-CN">
<head><!-- v1781043537 -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授信管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #f5f7fa; min-height: 100vh;
  display: flex; justify-content: center; padding: 20px 10px;
}
.container { width: 100%; max-width: 520px; }
.header {
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #fff; border-radius: 20px 20px 0 0;
  padding: 32px 28px 36px; position: relative;
}
.header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.header p { font-size: 13px; opacity: 0.85; }
.card {
  background: #fff; border-radius: 0 0 20px 20px;
  padding: 28px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  margin-bottom: 20px;
}
.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 14px; font-weight: 600;
  color: #555; margin-bottom: 8px;
}
.field input, .field select {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid #e0e4ea; border-radius: 12px;
  font-size: 16px; outline: none; background: #fafbfd;
  transition: border-color 0.2s;
}
.field input:focus, .field select:focus { border-color: #ff9800; background: #fff; }
.hint { font-size: 12px; color: #aaa; margin-top: 6px; }
.btn-save {
  width: 100%; padding: 15px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #fff; font-size: 17px; font-weight: 600;
  cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 4px 14px rgba(255,152,0,0.3);
  transition: all 0.2s;
}
.btn-save:hover { transform: translateY(-1px); }
.btn-save:active { transform: scale(0.98); }
.btn-del {
  width: 100%; padding: 13px; border: 1.5px solid #ffcdd2;
  border-radius: 14px; background: #fff; color: #e57373;
  font-size: 15px; font-weight: 600; cursor: pointer;
  margin-top: 10px; transition: all 0.2s;
}
.btn-del:hover { background: #ffebee; }
.status-ok {
  text-align: center; font-size: 14px; color: #43b97f;
  margin-top: 14px; font-weight: 600; display: none;
}
.status-ok.show { display: block; }

/* 用户列表 */
.user-list { margin-bottom: 24px; max-height:300px; overflow-y:auto; }
.user-item {
  background: #fff9f0; border-radius: 14px; padding: 16px 18px;
  margin-bottom: 12px; border: 1px solid #ffe0b2;
  cursor: pointer; transition: all 0.15s; position:relative;
}
.user-item:hover { border-color: #ff9800; background: #fff3e0; }
.user-item.active { border-color: #ff9800; background: #fff3e0; box-shadow: 0 2px 8px rgba(255,152,0,0.15); }
.user-item-name { font-size: 16px; font-weight: 700; color: #333; }
.user-item-detail { font-size: 13px; color: #888; margin-top: 4px; }

.preview-link {
  display: block; text-align: center; margin-top: 16px;
  font-size: 13px; color: #ff9800; text-decoration: none;
}
.preview-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔧 授信管理</h1>
    <p>按用户设置审批状态，修改后实时生效</p>
  </div>

  <div class="card">
    <!-- 用户列表 -->
    <div class="user-list" id="userList">
      <div style="text-align:center;color:#ccc;padding:30px;font-size:14px;">暂无用户数据</div>
    </div>

    <!-- 编辑区域 -->
    <div class="field">
      <label>用户姓名</label>
      <input type="text" id="adminName" placeholder="请输入用户姓名">
      <div class="hint">选择上方已有用户，或输入新用户名</div>
    </div>

    

    <div class="field">
      <label>审批状态</label>
      <select id="adminStatus">
        <option value="approved">✅ 审批通过</option>
        <option value="rejected">❌ 审批拒绝</option>
      </select>
    </div>

    <div class="field">
      <label>大数据评级</label>
      <select id="adminRating">
        <option value="">-- 请选择 --</option>
        <option value="AAA级">AAA级</option>
        <option value="AA级">AA级</option>
        <option value="A级">A级</option>
        <option value="BBB级">BBB级</option>
        <option value="BB级">BB级</option>
        <option value="B级">B级</option>
        <option value="CCC级">CCC级</option>
        <option value="CC级">CC级</option>
        <option value="C级">C级</option>
        <option value="D级">D级</option>
      </select>
    </div>

    <div class="field">
      <label>贷款类型</label>
      <select id="adminLoanType">
        <option value="">-- 请选择 --</option>
        <option value="经营贷款">经营贷款</option>
        <option value="消费贷款">消费贷款</option>
        <option value="房贷">房贷</option>
        <option value="车贷">车贷</option>
        <option value="信用贷">信用贷</option>
        <option value="抵押贷">抵押贷</option>
      </select>
    </div>

    <div class="field">
      <label>最高最高最高可授信额度</label>
      <input type="number" id="adminAmount" placeholder="例如: 50000" min="0" step="100">
    </div>

    
    <div class="field">
      <label>GitHub Token（用于写入额度数据）</label>
      <input type="password" id="adminToken" placeholder="ghp_xxxxxxxxxxxx">
      <div class="hint">需要 repo 权限的 Personal Access Token</div>
    </div>
    <button class="btn-save" onclick="saveAdmin()">💾 保存设置</button>
    <button class="btn-del" onclick="deleteUser()">🗑 删除该用户</button>
    <div class="status-ok" id="statusSaved">✅ 已保存，用户端实时生效</div>

    <a class="preview-link" href="credit.html" target="_blank">👉 打开用户端页面预览</a>
  </div>
</div>


<script>

  function connectWithToken() {
    const token = document.getElementById('token-input').value.trim();
    if (!token) {
      document.getElementById('token-status').textContent = '请输入 Token';
      document.getElementById('token-status').style.color = '#e74c3c';
      return;
    }
    GITHUB_TOKEN = token;
    document.getElementById('token-status').textContent = '连接中...';
    document.getElementById('token-status').style.color = '#666';
    // 验证 token 是否有效
    fetch('https://api.github.com/user', {
      headers: { 'Authorization': 'token ' + token, 'User-Agent': 'node' }
    }).then(function(r) {
      if (r.ok) {
        document.getElementById('token-section').style.display = 'none';
        document.getElementById('main-container').style.display = 'block';
        loadUserList();
      } else {
        document.getElementById('token-status').textContent = 'Token 无效，请重新输入';
        document.getElementById('token-status').style.color = '#e74c3c';
      }
    }).catch(function() {
      document.getElementById('token-status').textContent = '网络错误，请重试';
      document.getElementById('token-status').style.color = '#e74c3c';
    });
  }
  
var TOKEN = '';
var REPO = 'S-o-n-G-hua/merchant-app';
var BRANCH = 'main';
var FILE_PATH = 'credit-data.json';
var currentSha = '';
var creditData = null;

function showMsg(id, text, ok) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = ok ? 'msg msg-success' : 'msg msg-error';
}
function hideMsg(id) { document.getElementById(id).style.display = 'none'; }

function showCard(id) {
  ['balance-card','edit-card','quick-card'].forEach(function(c) {
    document.getElementById(c).style.display = c === id ? 'block' : 'none';
  });
}

function ghApi(method, path, body) {
  var opts = {
    method: method,
    headers: {
      'Authorization': 'token ' + TOKEN,
      'Content-Type': 'application/json',
      'User-Agent': 'merchant-admin'
    }
  };
  if (body) opts.body = JSON.stringify(body);
  return fetch('https://api.github.com' + path, opts).then(function(r) { return r.json(); });
}

function loadCreditData() {
  TOKEN = document.getElementById('gh-token').value.trim();
  if (!TOKEN) { showMsg('token-msg', '请输入 Token', false); return; }

  // 验证 token 并获取 balances.json
  ghApi('GET', '/repos/' + REPO + '/contents/' + FILE_PATH + '?ref=' + BRANCH)
    .then(function(res) {
      if (res.message && res.message.indexOf('Bad credentials') >= 0) {
        showMsg('token-msg', 'Token 无效或权限不足', false);
        return;
      }
      if (!res.content) {
        showMsg('token-msg', '获取数据失败: ' + (res.message || '未知错误'), false);
        return;
      }
      currentSha = res.sha;
      var binary = atob(res.content.replace(/\n/g, ''));
      var bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      var decoded = new TextDecoder('utf-8').decode(bytes);
      creditData = JSON.parse(decoded);

      showMsg('token-msg', '连接成功！已加载 ' + Object.keys(creditData.users || {}).length + ' 个用户', true);
      document.getElementById('token-card').querySelector('.btn-primary').textContent = '重新连接';

      renderUserList();
      document.getElementById('balance-card').style.display = 'block';
      document.getElementById('quick-card').style.display = 'block';
    })
    .catch(function(err) {
      showMsg('token-msg', '网络错误: ' + err.message, false);
    });
}

function renderUserList() {
  var ul = document.getElementById('user-list');
  var users = creditData.users || {};
  var keys = Object.keys(users);
  if (keys.length === 0) {
    ul.innerHTML = '<li class="empty">暂无用户数据，请通过「修改余额」添加</li>';
    return;
  }
  ul.innerHTML = keys.map(function(k) {
    return '<li class="user-item">' +
      '<div class="user-info"><span>' + k + '</span><br><small>最后更新: ' + (creditData.updatedAt || '-') + '</small></div>' +
      '<div class="user-balance">¥ ' + parseFloat(users[k]).toFixed(2) + '</div>' +
      '<button class="btn btn-sm btn-primary" style="margin-left:10px" onclick="editUser(\'' + k + '\')">&#9998;</button>' +
      '</li>';
  }).join('');
}

function selectUser(name) {
  document.getElementById('edit-user').value = username;
  document.getElementById('edit-amount').value = creditData.users[username] || 0;
  showCard('edit-card');
}

function saveAdmin() {
  var user = document.getElementById('edit-user').value.trim();
  var amount = parseFloat(document.getElementById('edit-amount').value);
  if (!user) { showMsg('edit-msg', '请输入用户名', false); return; }
  if (isNaN(amount)) { showMsg('edit-msg', '请输入有效金额', false); return; }

  if (!creditData) creditData = { users: {} };
  if (!creditData.users) creditData.users = {};
  creditData.users[user] = amount;
  creditData.updatedAt = new Date().toISOString();
  creditData.updatedBy = 'admin';

  var jsonStr = JSON.stringify(creditData, null, 2);
  var bytes = new TextEncoder().encode(jsonStr);
  var binary = Array.from(bytes).map(b => String.fromCharCode(b)).join('');
  var content = btoa(binary);
  var payload = { message: '更新余额: ' + user + ' -> ¥' + amount.toFixed(2), content: content, branch: BRANCH };
  if (currentSha) payload.sha = currentSha;

  ghApi('PUT', '/repos/' + REPO + '/contents/' + FILE_PATH, payload)
    .then(function(res) {
      if (res.content) {
        currentSha = res.content.sha;
        showMsg('edit-msg', '保存成功！' + user + ' 的余额已更新为 ¥' + amount.toFixed(2), true);
        renderUserList();
        showCard('balance-card');
      } else {
        showMsg('edit-msg', '保存失败: ' + (res.message || '未知错误'), false);
      }
    })
    .catch(function(err) {
      showMsg('edit-msg', '网络错误: ' + err.message, false);
    });
}

function refreshFromRemote() {
  loadData();
}
</script>

</body>
</html>
