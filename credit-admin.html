<!DOCTYPE html>
<html lang="zh-CN">
<head><!-- v1781043537 -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授信管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #f5f7fa; min-height: 100vh;
  display: flex; justify-content: center; padding: 20px 10px;
}
.container { width: 100%; max-width: 520px; }
.header {
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #fff; border-radius: 20px 20px 0 0;
  padding: 32px 28px 36px; position: relative;
}
.header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
.header p { font-size: 13px; opacity: 0.85; }
.card {
  background: #fff; border-radius: 0 0 20px 20px;
  padding: 28px 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  margin-bottom: 20px;
}
.field { margin-bottom: 18px; }
.field label {
  display: block; font-size: 14px; font-weight: 600;
  color: #555; margin-bottom: 8px;
}
.field input, .field select {
  width: 100%; padding: 13px 16px;
  border: 1.5px solid #e0e4ea; border-radius: 12px;
  font-size: 16px; outline: none; background: #fafbfd;
  transition: border-color 0.2s;
}
.field input:focus, .field select:focus { border-color: #ff9800; background: #fff; }
.hint { font-size: 12px; color: #aaa; margin-top: 6px; }
.btn-save {
  width: 100%; padding: 15px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #fff; font-size: 17px; font-weight: 600;
  cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 4px 14px rgba(255,152,0,0.3);
  transition: all 0.2s;
}
.btn-save:hover { transform: translateY(-1px); }
.btn-save:active { transform: scale(0.98); }
.btn-del {
  width: 100%; padding: 13px; border: 1.5px solid #ffcdd2;
  border-radius: 14px; background: #fff; color: #e57373;
  font-size: 15px; font-weight: 600; cursor: pointer;
  margin-top: 10px; transition: all 0.2s;
}
.btn-del:hover { background: #ffebee; }
.status-ok {
  text-align: center; font-size: 14px; color: #43b97f;
  margin-top: 14px; font-weight: 600; display: none;
}
.status-ok.show { display: block; }

/* 用户列表 */
.user-list { margin-bottom: 24px; max-height:300px; overflow-y:auto; }
.user-item {
  background: #fff9f0; border-radius: 14px; padding: 16px 18px;
  margin-bottom: 12px; border: 1px solid #ffe0b2;
  cursor: pointer; transition: all 0.15s; position:relative;
}
.user-item:hover { border-color: #ff9800; background: #fff3e0; }
.user-item.active { border-color: #ff9800; background: #fff3e0; box-shadow: 0 2px 8px rgba(255,152,0,0.15); }
.user-item-name { font-size: 16px; font-weight: 700; color: #333; }
.user-item-detail { font-size: 13px; color: #888; margin-top: 4px; }

.preview-link {
  display: block; text-align: center; margin-top: 16px;
  font-size: 13px; color: #ff9800; text-decoration: none;
}
.preview-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔧 授信管理</h1>
    <p>按用户设置审批状态，修改后实时生效</p>
  </div>

  <div class="card">
    <!-- 用户列表 -->
    <div class="user-list" id="userList">
      <div style="text-align:center;color:#ccc;padding:30px;font-size:14px;">暂无用户数据</div>
    </div>

    <!-- 编辑区域 -->
    <div class="field">
      <label>用户姓名</label>
      <input type="text" id="adminName" placeholder="请输入用户姓名">
      <div class="hint">选择上方已有用户，或输入新用户名</div>
    </div>

    

    <div class="field">
      <label>审批状态</label>
      <select id="adminStatus">
        <option value="approved">✅ 审批通过</option>
        <option value="rejected">❌ 审批拒绝</option>
      </select>
    </div>

    <div class="field">
      <label>大数据评级</label>
      <select id="adminRating">
        <option value="">-- 请选择 --</option>
        <option value="AAA级">AAA级</option>
        <option value="AA级">AA级</option>
        <option value="A级">A级</option>
        <option value="BBB级">BBB级</option>
        <option value="BB级">BB级</option>
        <option value="B级">B级</option>
        <option value="CCC级">CCC级</option>
        <option value="CC级">CC级</option>
        <option value="C级">C级</option>
        <option value="D级">D级</option>
      </select>
    </div>

    <div class="field">
      <label>贷款类型</label>
      <select id="adminLoanType">
        <option value="">-- 请选择 --</option>
        <option value="经营贷款">经营贷款</option>
        <option value="消费贷款">消费贷款</option>
        <option value="房贷">房贷</option>
        <option value="车贷">车贷</option>
        <option value="信用贷">信用贷</option>
        <option value="抵押贷">抵押贷</option>
        <option value="装修贷">装修贷</option>
        <option value="公积金贷">公积金贷</option>
      </select>
    </div>

    <div class="field">
      <label>年化利率(%)</label>
      <input type="text" id="adminInterestRate" placeholder="例如: 3.85">
    </div>

    <div class="field">
      <label>最高可授信额度</label>
      <input type="number" id="adminAmount" placeholder="例如: 50000" min="0" step="100">
    </div>

    
    <div class="field">
      <label>GitHub Token（用于写入额度数据）</label>
      <input type="password" id="adminToken" placeholder="ghp_xxxxxxxxxxxx">
      <div class="hint">需要 repo 权限的 Personal Access Token</div>
    </div>
    <button class="btn-save" onclick="saveAdmin()">💾 保存设置</button>
    <button class="btn-del" onclick="deleteUser()">🗑 删除该用户</button>
    <div class="status-ok" id="statusSaved">✅ 已保存，用户端实时生效</div>

    <a class="preview-link" href="credit.html" target="_blank">👉 打开用户端页面预览</a>
  </div>
</div>


<script>
var TOKEN = '';
var REPO = 'S-o-n-G-hua/merchant-app';
var BRANCH = 'main';
var FILE_PATH = 'credit-data.json';
var currentSha = '';
var creditData = null;

function showMsg(id, text, ok) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.style.color = ok ? '#27ae60' : '#e74c3c';
}

function ghApi(method, path, body) {
  var opts = { method: method, headers: { 'Authorization': 'token ' + TOKEN, 'Content-Type': 'application/json', 'User-Agent': 'merchant-admin' } };
  if (body) opts.body = JSON.stringify(body);
  return fetch('https://api.github.com' + path, opts).then(function(r) { return r.json(); });
}

function loadData() {
  TOKEN = document.getElementById('adminToken').value.trim();
  if (!TOKEN) { showMsg('statusSaved', '请输入 Token', false); return; }
  showMsg('statusSaved', '加载中...', false);

  ghApi('GET', '/repos/' + REPO + '/contents/' + FILE_PATH + '?ref=' + BRANCH)
    .then(function(res) {
      if (res.message) { showMsg('statusSaved', 'Token 错误: ' + res.message, false); return; }
      if (!res.content) { showMsg('statusSaved', '获取数据失败', false); return; }
      currentSha = res.sha;
      var binary = atob(res.content.replace(/\n/g, ''));
      var bytes = Uint8Array.from(binary, function(c) { return c.charCodeAt(0); });
      creditData = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      showMsg('statusSaved', '连接成功 ' + Object.keys(creditData.users || {}).length + ' 个用户', true);
      renderList();
    })
    .catch(function(err) { showMsg('statusSaved', '网络错误: ' + err.message, false); });
}

function renderList() {
  var ul = document.getElementById('userList');
  if (!ul || !creditData) return;
  var users = creditData.users || {};
  var keys = Object.keys(users);
  if (keys.length === 0) { ul.innerHTML = '<li style="padding:8px;color:#999">暂无用户</li>'; return; }
  ul.innerHTML = keys.map(function(k) {
    var u = users[k] || {};
    var st = u.status || 'pending';
    var sc = st === 'approved' ? 'green' : (st === 'rejected' ? 'red' : 'orange');
    var am = u.amount || '-';
    return '<li onclick="selectUser(\'' + k + '\')" style="padding:8px;border-bottom:1px solid #eee;cursor:pointer">' +
      '<b>' + k + '</b> | ' + am + ' | <span style="color:' + sc + '">' + st + '</span></li>';
  }).join('');
}

function selectUser(name) {
  var u = creditData && creditData.users ? creditData.users[name] : null;
  document.getElementById('adminName').value = name || '';
  var sEl = document.getElementById('adminStatus'); if (sEl) sEl.value = u ? (u.status || 'pending') : 'pending';
  var aEl = document.getElementById('adminAmount'); if (aEl) aEl.value = u ? (u.amount || '') : '';
  var rEl = document.getElementById('adminRating'); if (rEl) rEl.value = u ? (u.rating || '') : '';
  var lEl = document.getElementById('adminLoanType'); if (lEl) lEl.value = u ? (u.loanType || '') : '';
  var irEl = document.getElementById('adminInterestRate'); if (irEl) irEl.value = u ? (u.interestRate || '') : '';
}

function saveAdmin() {
  var name = document.getElementById('adminName').value.trim();
  var tk = document.getElementById('adminToken').value.trim();
  if (!tk) { showMsg('statusSaved', '请输入 Token', false); return; }
  // 没加载数据时，先加载（相当于"连接"）
  if (!currentSha) {
    TOKEN = tk;
    showMsg('statusSaved', '连接中...', false);
    ghApi('GET', '/repos/' + REPO + '/contents/' + FILE_PATH + '?ref=' + BRANCH)
      .then(function(res) {
        if (res.message) { showMsg('statusSaved', 'Token 错误: ' + res.message, false); return; }
        if (!res.content) { showMsg('statusSaved', '获取数据失败', false); return; }
        currentSha = res.sha;
        var binary = atob(res.content.replace(/\n/g, ''));
        var bytes = Uint8Array.from(binary, function(c) { return c.charCodeAt(0); });
        creditData = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        showMsg('statusSaved', '连接成功 ' + Object.keys(creditData.users || {}).length + ' 个用户', true);
        renderList();
      })
      .catch(function(err) { showMsg('statusSaved', '网络错误: ' + err.message, false); });
    return;
  }
  if (!creditData) creditData = { users: {} };
  if (!creditData.users) creditData.users = {};
  creditData.users[name] = {
    status: (document.getElementById('adminStatus') || {}).value || 'pending',
    amount: (document.getElementById('adminAmount') || {}).value || '',
    rating: (document.getElementById('adminRating') || {}).value || '',
    loanType: (document.getElementById('adminLoanType') || {}).value || '',
    interestRate: (document.getElementById('adminInterestRate') || {}).value || '',
    updatedAt: new Date().toLocaleString('zh-CN')
  };
  var jsonStr = JSON.stringify(creditData, null, 2);
  var bytes = new TextEncoder().encode(jsonStr);
  var binary = Array.from(bytes).map(function(b) { return String.fromCharCode(b); }).join('');
  var content = btoa(binary);
  // Re-fetch latest SHA before save to avoid 409 conflict
  showMsg('statusSaved', '获取最新数据...', false);
  ghApi('GET', '/repos/' + REPO + '/contents/' + FILE_PATH + '?ref=' + BRANCH)
    .then(function(latest) {
      if (!latest.sha) { showMsg('statusSaved', '获取SHA失败', false); return; }
      currentSha = latest.sha;
      // Re-load creditData to avoid overwriting others' changes
      if (latest.content) {
        var bin2 = atob(latest.content.replace(/\n/g, ''));
        var bt2 = Uint8Array.from(bin2, function(c) { return c.charCodeAt(0); });
        try { creditData = JSON.parse(new TextDecoder('utf-8').decode(bt2)); } catch(e) {}
      }
      var payload = { message: '更新授信 ' + name, content: content, branch: BRANCH, sha: currentSha };
      showMsg('statusSaved', '保存中...', false);
      return ghApi('PUT', '/repos/' + REPO + '/contents/' + FILE_PATH, payload);
    })
    .then(function(res) {
      if (!res) return;
      if (res.content) {
        currentSha = res.content.sha;
        showMsg('statusSaved', '保存成功 ' + name, true);
        renderList();
      } else {
        showMsg('statusSaved', '保存失败 ' + (res.message || ''), false);
      }
    })
    .then(function(res) {
      if (res.content) {
        currentSha = res.content.sha;
        showMsg('statusSaved', '保存成功 ' + name, true);
        renderList();
      } else {
        showMsg('statusSaved', '保存失败 ' + (res.message || ''), false);
      }
    })
    .catch(function(err) { showMsg('statusSaved', '网络错误 ' + err.message, false); });
}

function deleteUser() {
  var name = document.getElementById('adminName').value.trim();
  if (!name || !creditData || !creditData.users[name]) return;
  delete creditData.users[name];
  var jsonStr = JSON.stringify(creditData, null, 2);
  var bytes = new TextEncoder().encode(jsonStr);
  var binary = Array.from(bytes).map(function(b) { return String.fromCharCode(b); }).join('');
  var content = btoa(binary);
  var payload = { message: '删除 ' + name, content: content, branch: BRANCH, sha: currentSha };
  ghApi('PUT', '/repos/' + REPO + '/contents/' + FILE_PATH, payload)
    .then(function(res) {
      if (res.content) { currentSha = res.content.sha; showMsg('statusSaved', '已删除 ' + name, true); renderList(); document.getElementById('adminName').value = ''; }
      else { showMsg('statusSaved', '删除失败', false); }
    });
}
</script>

</body>
</html>
